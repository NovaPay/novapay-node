version: 2
updates:
  # The package has no runtime dependencies, so every npm update is tooling —
  # one grouped PR a week instead of six.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    # Skip versions younger than this, so a hijacked release has time to be
    # yanked before it ever lands in a PR.
    cooldown:
      default-days: 5
    ignore:
      # TS 7 crashes the dts build: tsup bundles rollup-plugin-dts built against
      # TS 5.x, which reads an internal `useCaseSensitiveFileNames` that TS 7
      # dropped — `npm run build` emits js/cjs, then dies before any .d.ts.
      # Drop this once tsup ships a TS 7-capable dts step.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      dev-dependencies:
        patterns: ['*']
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: npm
    directory: /example
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    cooldown:
      default-days: 5
    groups:
      example:
        patterns: ['*']
    commit-message:
      prefix: chore

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 5
    commit-message:
      prefix: ci

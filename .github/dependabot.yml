version: 2
updates:
  # The package has no runtime dependencies, so every npm update is tooling —
  # one grouped PR a week instead of six.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      dev-dependencies:
        patterns: ['*']
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: npm
    directory: /example
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      example:
        patterns: ['*']
    commit-message:
      prefix: chore

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
